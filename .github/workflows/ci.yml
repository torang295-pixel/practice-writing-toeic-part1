name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Restore dependencies
      run: dotnet restore practice_toeic_writing_part1.sln

    - name: Build Solution
      run: dotnet build practice_toeic_writing_part1.sln --configuration Release --no-restore

    - name: Run .NET Unit Tests
      run: dotnet test practice_toeic_writing_part1.sln --configuration Release --no-build --verbosity normal

    - name: Run UI Tests
      run: npm test
